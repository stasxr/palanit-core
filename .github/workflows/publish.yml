name: Publish to PyPI

# Builds the package and publishes it to PyPI whenever a GitHub Release is published.
# Uses PyPI Trusted Publishing (OIDC) — no API token is stored anywhere.
# One-time setup on PyPI: project palanit-core → Publishing → add a GitHub publisher
#   owner: stasxr · repo: palanit-core · workflow: publish.yml · environment: (leave blank)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    name: Build & publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
